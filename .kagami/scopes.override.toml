# kagami scopes for BackendKit — the one way to run this package's tests
# (never `swift test` from an agent, per [[kagami-only-never-swift-test]]).
#
# Hand-authored. Until 2026-10-29 this repo declared nothing: `kagami test
# --scopes` auto-discovered the two targets and wrote a CACHE
# (`generated_by = "kagami auto-discover --write-cache"`). A cache is derived,
# so the gate drifted with discovery and no floor was owned by anyone.
#
# Arrays stay on ONE line each: kagami's TOML reader rejects multi-line arrays.

[[scopes]]
name = "BackendKitCoreTests"
language = "swift"
package_path = "."
test_target_name = "BackendKitCoreTests"
module_patterns = ["BackendKitCoreTests"]
expected_test_min = 25
timeout_seconds = 600
description = "BackendKitCore — the driver-free core: types, errors and the connection contract."

[[scopes]]
name = "BackendKitPostgresTests"
language = "swift"
package_path = "."
test_target_name = "BackendKitPostgresTests"
module_patterns = ["BackendKitPostgresTests"]
expected_test_min = 4
timeout_seconds = 600
description = "BackendKitPostgres — the Postgres/NIO driver. Floor is 4, not 5: one test needs a live database and SKIPS without one, so 4 is what passes on a machine with no server (measured 2026-10-29: 4 passed, 0 failed, 1 skipped)."

[[scopes]]
name = "BackendKitSQLTests"
language = "swift"
package_path = "."
test_target_name = "BackendKitSQLTests"
module_patterns = ["BackendKitSQLTests"]
expected_test_min = 2
timeout_seconds = 600
description = "BackendKitSQL — SQLRepository binding evidence (offline, 2 tests) plus the live Postgres round-trip and SQLKitBenchmark conformance, which SKIP without BACKENDKIT_LIVE_TESTS=1 (floor 2 is the offline count)."

[[scopes]]
name = "BackendKitSQLiteTests"
language = "swift"
package_path = "."
test_target_name = "BackendKitSQLiteTests"
module_patterns = ["BackendKitSQLiteTests"]
expected_test_min = 15
timeout_seconds = 600
description = "BackendKitSQLite — SQLKit conformance benchmark + SQLRepository round-trips (memory, file) with a hostile-string bind. Offline: no live server, no env flag."

[[scopes]]
name = "BackendKitDuckDBTests"
language = "swift"
package_path = "."
test_target_name = "BackendKitDuckDBTests"
module_patterns = ["BackendKitDuckDBTests"]
expected_test_min = 8
timeout_seconds = 1800
description = "BackendKitDuckDB — custom SQLKit driver over duckdb-swift: SQLKit conformance sub-suites (codable, enum, upsert, union, json-paths; testPlanets replayed minus a DuckDB-rejected GROUP BY) + SQLRepository round-trips (memory, file) with a hostile-string bind. Embedded and offline: no live server, no env flag."
